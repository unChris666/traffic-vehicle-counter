# ============================================
# BoT-SORT - Handheld Smartphone Traffic Video
# ============================================

tracker_type: botsort

# --------------------------------------------
# Detection / association thresholds
# --------------------------------------------

track_high_thresh: 0.15
track_low_thresh: 0.05
new_track_thresh: 0.15

# Keep lost tracks alive during short
# detection failures caused by camera shake,
# compression, blur, and partial occlusion.
track_buffer: 60

# More permissive association
match_thresh: 0.80

# Fuse detection confidence with IoU distance
fuse_score: True

# --------------------------------------------
# Global Motion Compensation
# --------------------------------------------

# Important for handheld smartphone footage.
gmc_method: sparseOptFlow

# --------------------------------------------
# Re-identification
# --------------------------------------------

# Keep ReID disabled for the first experiment.
with_reid: False

# Required by current Ultralytics BoT-SORT API
# even when ReID is disabled.
model: auto

# ReID parameters
proximity_thresh: 0.50
appearance_thresh: 0.80
