# ==========================================
# Phase 6A production configuration
# ==========================================

model:
  name: yolo26m.pt

  tracker: configs/botsort_phone.yaml

  imgsz: 1280

  conf_threshold: 0.20

  iou_threshold: 0.50

  device: auto


counting:

  line:
    x1_ratio: 0.95
    y1_ratio: 0.20

    x2_ratio: 0.05
    y2_ratio: 0.95

  # Handheld smartphone footage
  line_deadband_px: 20.0


  # Existing diagnostics
  min_track_observations: 5

  max_trajectory_gap_sec: 1.0


  # ==========================================
  # PHASE 1
  # CROSSING IDENTITY
  # ==========================================

  pre_crossing_distance_px: 100.0

  max_identity_reconnect_gap_sec: 1.0

  max_identity_reconnect_distance_px: 100.0

  identity_match_threshold: 0.82

  identity_match_margin: 0.08

  velocity_gate_px_per_frame: 30.0

  min_pre_crossing_observations: 3


  # ==========================================
  # PHASE 2
  # Crossing-event dedup
  # NOT USED YET
  # ==========================================

  motorcycle_dedup:
    time_sec: 1.50

    distance_px: 80.0


classes:

  target:
    - person
    - motorcycle
    - car
    - truck
    - bus

  vehicles:
    - motorcycle
    - car
    - truck
    - bus


output:
  directory: outputs
