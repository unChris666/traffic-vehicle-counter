# Phase 6A production configuration
model:
  name: yolo26m.pt
  tracker: botsort.yaml
  imgsz: 960
  conf_threshold: 0.25
  iou_threshold: 0.50
  device: auto

counting:
  line:
    x1_ratio: 0.95
    y1_ratio: 0.20
    x2_ratio: 0.05
    y2_ratio: 0.95
  line_deadband_px: 8.0
  min_track_observations: 5
  max_trajectory_gap_sec: 1.5
  motorcycle_dedup:
    time_sec: 1.50
    distance_px: 80.0

classes:
  target:
    - person
    - motorcycle
    - car
    - truck
    - bus
  vehicles:
    - motorcycle
    - car
    - truck
    - bus

output:
  directory: outputs
